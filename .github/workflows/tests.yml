name: Tests

# La suite corre en cada push y en cada pull request contra main.
# Esto es la parte de "CI/CD test integration": nadie mergea sin que
# los tests hayan pasado.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite dispararlo a mano desde la pestaña Actions.
  workflow_dispatch:

jobs:
  unit:
    name: Tests unitarios (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: Tests de API y UI (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Instala solo los navegadores necesarios, con sus dependencias de sistema.
      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      # El reporte se sube siempre, sobre todo cuando algo falla:
      # es la evidencia para diagnosticar sin reproducir localmente.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
